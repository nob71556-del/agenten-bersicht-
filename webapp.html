<title>FastFlow Gezeiten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Thema „Gezeiten bei Nacht“: Fasten = Ebbe, Essen = Flut. Bewusst nur dunkel (Nachtmeer).
   Layout: animiertes Meer als Vollbild-Canvas, darüber eine Handy-breite App-Spalte,
   unten feste Tab-Leiste, links darüber das Maskottchen Flo mit Sprechblase. */
:root {
  --night: #050d1a;
  --deep: #0a2233;
  --glass: rgba(14, 44, 62, 0.62);
  --glass-strong: rgba(10, 34, 50, 0.86);
  --edge: rgba(143, 220, 214, 0.18);
  --ink: #eaf4f3;
  --muted: #93b4b9;
  --moon: #f6ecc8;
  --glow: #5fe3d0;
  --glow-2: #7fb6ff;
  --coral: #ff8f6e;
  --ok: #8be3a5;
  --f-display: "Sora", "Avenir Next", "Segoe UI", sans-serif;
  --f-body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --tabbar: 68px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
}
#sea { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
.app {
  position: relative; z-index: 1; max-width: 520px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(var(--tabbar) + 150px + env(safe-area-inset-bottom, 0px));
}
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 1.55rem; font-weight: 800; }
h2 { font-size: 1.15rem; font-weight: 700; }
h3 { font-size: 0.98rem; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--glow); }

.card {
  background: var(--glass); border: 1px solid var(--edge); border-radius: 22px; padding: 18px;
  backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
  box-shadow: 0 10px 40px rgba(0, 0, 0, .28), inset 0 1px 0 rgba(255,255,255,.06);
  display: grid; gap: 12px; min-width: 0;
}
.stack { display: grid; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }

/* Buttons mit Druck- und Wellen-Animation */
button, .btn {
  position: relative; overflow: hidden; font: inherit; font-weight: 700; color: var(--ink); cursor: pointer;
  background: rgba(95, 227, 208, .1); border: 1px solid var(--edge); border-radius: 14px; padding: 10px 16px;
  transition: transform .15s cubic-bezier(.3,.7,.4,1.5), background .2s, border-color .2s, box-shadow .2s;
}
button:hover { border-color: rgba(95,227,208,.5); }
button:active { transform: scale(.94); }
button.primary {
  background: linear-gradient(135deg, #5fe3d0, #4fb4e8); color: #04202a; border: 0;
  box-shadow: 0 6px 24px rgba(95, 227, 208, .35);
}
button.ghost { background: transparent; }
button.danger { background: rgba(255,143,110,.12); border-color: rgba(255,143,110,.5); color: #ffd2c3; }
button.chip { border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 14px; }
button.chip[aria-pressed="true"] { background: rgba(95,227,208,.25); border-color: var(--glow); }
button.link { background: none; border: 0; padding: 0; color: var(--glow); text-decoration: underline; font-weight: 600; }
button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.ripple { position: absolute; border-radius: 50%; transform: scale(0); background: rgba(255,255,255,.35); animation: ripple .6s ease-out forwards; pointer-events: none; }
@keyframes ripple { to { transform: scale(3.2); opacity: 0; } }
:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }

input[type="text"], input[type="number"], input[type="time"], input[type="date"], input[type="datetime-local"] {
  font: inherit; font-family: var(--f-mono); color: var(--ink); background: rgba(5, 18, 28, .6);
  border: 1px solid var(--edge); border-radius: 12px; padding: 10px 12px; min-width: 0;
  transition: border-color .2s, box-shadow .2s;
}
input[type="text"] { font-family: var(--f-body); font-size: 17px; width: 100%; }
input:focus { border-color: var(--glow); box-shadow: 0 0 0 4px rgba(95,227,208,.15); outline: none; }
label.field { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }

/* Schalter */
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: rgba(147,180,185,.25); transition: background .25s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); transition: transform .3s cubic-bezier(.3,.7,.4,1.4); box-shadow: 0 2px 6px rgba(0,0,0,.3); }
.switch input:checked + span { background: var(--glow); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2px solid var(--glow); outline-offset: 3px; }
.check { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--glow); margin-top: 2px; flex: none; }

/* Ansichtswechsel */
.view { animation: viewIn .45s cubic-bezier(.2,.8,.2,1); }
@keyframes viewIn { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: none; } }
.pop { animation: pop .5s cubic-bezier(.3,.7,.4,1.5); }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }

/* Kopf */
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
.top .date { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }

/* Gezeiten-Ring */
.ringwrap { display: grid; place-items: center; position: relative; padding: 6px 0 2px; }
.ring { width: min(78vw, 290px); height: auto; overflow: visible; }
.ring .track { fill: none; stroke: rgba(147,180,185,.16); stroke-width: 14; }
.ring .prog { fill: none; stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1); filter: drop-shadow(0 0 10px rgba(95,227,208,.55)); }
.ring .tick { stroke: rgba(147,180,185,.35); stroke-width: 2; }
.ring .bead { fill: var(--moon); filter: drop-shadow(0 0 8px rgba(246,236,200,.9)); }
.ringcenter { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 4px; }
.ringcenter .mode { font-family: var(--f-mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--glow); }
.ringcenter .time { font-family: var(--f-display); font-weight: 800; font-size: clamp(2.2rem, 11vw, 3rem); line-height: 1; font-variant-numeric: tabular-nums; }
.ringcenter .until { font-size: 13px; color: var(--muted); }
.eating .ringcenter .mode { color: var(--moon); }

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: rgba(5, 18, 28, .45); border: 1px solid var(--edge); border-radius: 16px; padding: 12px; min-width: 0; }
.tile b { display: block; font-family: var(--f-display); font-size: 1.25rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile span { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-family: var(--f-mono); }
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.kpis .tile b { font-size: 1.5rem; }
.kpis .tile small { color: var(--muted); font-size: 12px; display: block; }

/* Wochenband */
.week { display: grid; gap: 7px; }
.wrow { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: center; }
.wrow .d { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.wrow.today .d { color: var(--moon); font-weight: 700; }
.track { position: relative; height: 16px; background: rgba(127,182,255,.12); border-radius: 99px; overflow: hidden; }
.seg { position: absolute; top: 0; bottom: 0; border-radius: 99px; background: linear-gradient(90deg, #5fe3d0, #4fb4e8); transform-origin: left; animation: grow .8s cubic-bezier(.2,.8,.2,1) both; }
.seg.cont { background: repeating-linear-gradient(135deg, #5fe3d0 0 5px, #3aa99c 5px 10px); }
@keyframes grow { from { transform: scaleX(0); } }
.nowmark { position: absolute; top: 0; bottom: 0; width: 3px; border-radius: 2px; background: var(--moon); box-shadow: 0 0 10px var(--moon); }
.axis { display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.axis div { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 10px; color: var(--muted); }

/* Plan */
.day { display: grid; gap: 10px; padding: 14px; border-radius: 18px; background: rgba(5,18,28,.45); border: 1px solid var(--edge); transition: opacity .3s, transform .3s; }
.day.off { opacity: .55; }
.day .times { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.day .meta { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 12px; background: rgba(127,182,255,.14); color: #cfe2ff; font-family: var(--f-mono); }
.pill.glow { background: rgba(95,227,208,.16); color: #b8fff3; }
.pill.moon { background: rgba(246,236,200,.14); color: var(--moon); }
.hint { font-size: 13px; padding: 10px 12px; border-radius: 14px; background: rgba(127,182,255,.1); border-left: 3px solid var(--glow-2); }
.hint.warning { background: rgba(255,143,110,.1); border-left-color: var(--coral); }

/* Auswertung */
.chartbox { overflow-x: auto; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg.chart text { fill: var(--muted); font: 13px var(--f-mono); }
svg.chart .grid { stroke: rgba(147,180,185,.18); fill: none; }
svg.chart .barr { fill: url(#barGrad); transform-box: fill-box; transform-origin: bottom; animation: barUp .9s cubic-bezier(.2,.8,.2,1) both; }
@keyframes barUp { from { transform: scaleY(0); } }
svg.chart .target { stroke: var(--moon); stroke-width: 2; stroke-dasharray: 5 4; fill: none; opacity: .8; }
svg.chart .trend { stroke: var(--glow); stroke-width: 3; fill: none; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.4s ease-out forwards; filter: drop-shadow(0 0 6px rgba(95,227,208,.6)); }
@keyframes draw { to { stroke-dashoffset: 0; } }
svg.chart .pt { fill: var(--glow-2); opacity: .7; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -2px; }
.sess { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.sess li { padding: 12px; border-radius: 14px; background: rgba(5,18,28,.45); display: grid; gap: 6px; font-size: 14px; animation: viewIn .4s both; }
.sess .ok { color: var(--ok); }
.tile b, .tile small, .badge b, .badge small { overflow-wrap: anywhere; } .sess .miss { color: var(--coral); }
.sess summary { cursor: pointer; color: var(--glow); font-size: 13px; font-weight: 600; }
.sess details .row { margin-top: 8px; }

/* Tab-Leiste */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to top, rgba(4, 12, 22, .96), rgba(4, 12, 22, .82));
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border-top: 1px solid var(--edge);
}
.tabbar nav { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.tabbar a {
  position: relative; display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 14px;
  color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 700; transition: color .25s, transform .15s;
}
.tabbar a:active { transform: scale(.9); }
.tabbar a svg { width: 24px; height: 24px; transition: transform .35s cubic-bezier(.3,.7,.4,1.6); }
.tabbar a[aria-current="page"] { color: var(--ink); }
.tabbar a[aria-current="page"] svg { transform: translateY(-3px) scale(1.12); color: var(--glow); filter: drop-shadow(0 0 8px rgba(95,227,208,.7)); }
.tabbar a[aria-current="page"]::after { content: ""; position: absolute; bottom: 0; width: 18px; height: 3px; border-radius: 3px; background: var(--glow); box-shadow: 0 0 10px var(--glow); animation: pop .4s both; }

/* Maskottchen Flo */
.buddy {
  position: fixed; z-index: 15; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--tabbar) + 6px + env(safe-area-inset-bottom, 0px));
  width: min(520px, 100%); padding: 0 max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
  display: flex; align-items: flex-end; gap: 6px; pointer-events: none;
}
.otterbtn { pointer-events: auto; background: none; border: 0; padding: 0; width: 92px; height: 92px; flex: none; border-radius: 50%; overflow: visible; box-shadow: none; }
.otterbtn:active { transform: scale(.92) rotate(-4deg); }
.otterbtn > span, .otterbtn > [data-otter] { display: block; width: 100%; height: 100%; }
.otter { width: 100%; height: 100%; overflow: visible; display: block; }
.otter .bob { animation: bob 3.2s ease-in-out infinite; transform-origin: 60px 100px; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-6px) rotate(2deg); } }
.otter .eyes { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
.otter .pencil { transform-box: fill-box; transform-origin: 0 100%; animation: scribble 1.4s ease-in-out infinite; }
@keyframes scribble { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-12deg); } }
.otter.happy .bob { animation: hop .7s cubic-bezier(.3,.7,.4,1.5) 3; }
@keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-18px) rotate(-6deg); } }
.otter .waterline { animation: lap 2.6s ease-in-out infinite; }
@keyframes lap { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-6px); } }
.bubble {
  pointer-events: auto; position: relative; margin-bottom: 44px; max-width: 340px;
  background: rgba(246, 236, 200, .97); color: #10232b; border-radius: 18px 18px 18px 6px; padding: 11px 14px;
  font-size: 14.5px; line-height: 1.4; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.35);
  transform-origin: 0 100%; animation: bubbleIn .45s cubic-bezier(.3,.7,.4,1.5);
  cursor: pointer;
}
.bubble::before { content: ""; position: absolute; left: -7px; bottom: 10px; border: 8px solid transparent; border-right-color: rgba(246,236,200,.97); border-left: 0; }
.bubble.out { animation: bubbleOut .35s ease-in forwards; }
@keyframes bubbleIn { from { opacity: 0; transform: scale(.6) translateY(10px); } }
@keyframes bubbleOut { to { opacity: 0; transform: scale(.8) translateY(8px); } }
.bubble .who { display: block; font-family: var(--f-mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #2b7c74; margin-bottom: 2px; }
.bubble .caret { display: inline-block; width: 7px; height: 14px; background: #10232b; vertical-align: -2px; margin-left: 2px; animation: caret .8s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }

/* Onboarding */
.onboard { position: fixed; inset: 0; z-index: 40; overflow-y: auto; display: grid; place-items: center;
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); }
.onboard .panel { width: min(460px, 100%); display: grid; gap: 18px; }
.onboard .hero { display: grid; justify-items: center; gap: 6px; text-align: center; }
.onboard .hero .otterbtn { width: 150px; height: 150px; pointer-events: none; }
.onboard h1 { font-size: 1.9rem; text-align: center; }
.dots { display: flex; justify-content: center; gap: 8px; }
.dots i { width: 8px; height: 8px; border-radius: 99px; background: rgba(147,180,185,.35); transition: width .35s, background .35s; }
.dots i.on { width: 26px; background: var(--glow); }
.choices { display: grid; gap: 10px; }
.choice { text-align: left; display: grid; gap: 2px; padding: 14px 16px; border-radius: 18px; background: rgba(5,18,28,.5); }
.choice b { font-family: var(--f-display); font-size: 1.02rem; }
.choice span { color: var(--muted); font-weight: 500; font-size: 13px; }
.choice[aria-pressed="true"] { border-color: var(--glow); background: rgba(95,227,208,.16); box-shadow: 0 0 0 3px rgba(95,227,208,.15); }
.splash { position: fixed; inset: 0; z-index: 50; display: grid; place-content: center; justify-items: center; gap: 10px; text-align: center; transition: opacity .5s; }
.splash .otterbtn { width: 130px; height: 130px; }

.toast {
  position: fixed; z-index: 60; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  background: var(--glass-strong); border: 1px solid var(--glow); color: var(--ink); padding: 10px 16px; border-radius: 99px;
  font-weight: 700; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.4); animation: toastIn .4s cubic-bezier(.3,.7,.4,1.5);
}
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, -16px) scale(.9); } }
.confetti { position: fixed; z-index: 55; pointer-events: none; width: 8px; height: 8px; border-radius: 50%; background: var(--glow); animation: bubbleRise 1.6s ease-out forwards; }
@keyframes bubbleRise { to { transform: translate(var(--dx), -220px) scale(.4); opacity: 0; } }

.notice { font-size: 13px; padding: 10px 12px; border-radius: 14px; background: rgba(255,143,110,.12); border: 1px solid rgba(255,143,110,.35); }
/* Körper-Szene */
.bodycard .cellscene { width: 100%; height: auto; display: block; max-height: 220px; }
.cellscene .membrane { fill: rgba(95,227,208,.07); stroke: rgba(95,227,208,.55); stroke-width: 2.5; transform-box: fill-box; transform-origin: center; animation: membrane 4s ease-in-out infinite; }
@keyframes membrane { 50% { transform: scale(1.015, .985); } }
.cellscene .nucleus { fill: rgba(127,182,255,.22); stroke: rgba(127,182,255,.5); stroke-width: 1.5; }
.cellscene .nucleolus { fill: rgba(127,182,255,.45); }
.nutri { fill: #ffd27a; animation: flowIn 3.2s ease-in-out infinite; }
@keyframes flowIn { 0% { transform: translateX(0); opacity: 0; } 15%, 70% { opacity: 1; } 100% { transform: translateX(150px); opacity: 0; } }
.hex { fill: rgba(246,236,200,.75); stroke: rgba(246,236,200,.95); stroke-width: 1; transform-box: fill-box; transform-origin: center; }
.hex.fill { animation: hexIn 3s ease-out infinite; }
@keyframes hexIn { 0% { transform: scale(0); opacity: 0; } 30%, 85% { transform: scale(1); opacity: 1; } 100% { opacity: 0; } }
.hex.use { animation: hexUse 3.6s ease-in-out infinite; }
@keyframes hexUse { 0%, 20% { transform: scale(1); opacity: 1; } 60% { transform: scale(.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.gluc { fill: #ffd27a; animation: outward 3.6s ease-out infinite; }
@keyframes outward { 0% { transform: translate(0, 0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)); opacity: 0; } }
.fatdrop { fill: rgba(255,210,122,.55); stroke: #ffd27a; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: fatShrink 4s ease-in-out infinite; }
@keyframes fatShrink { 0%, 100% { transform: scale(1); } 50% { transform: scale(.7); } }
.spark { fill: #fff3b0; animation: outward 2.6s ease-out infinite; }
.ketone { animation: ketone 4s ease-in-out infinite; }
.ketone circle { fill: rgba(95,227,208,.25); stroke: #5fe3d0; stroke-width: 1.2; }
.ketone text { fill: #5fe3d0; font: 700 8px var(--f-mono); }
@keyframes ketone { 0% { transform: translate(0, 0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(150px, -20px); opacity: 0; } }
.junk { transform-box: fill-box; transform-origin: center; animation: junk 6s ease-in-out infinite; }
.junk path { fill: #6f7d86; stroke: #a3b1b9; stroke-width: 1; }
@keyframes junk { 0%, 42% { opacity: 1; transform: scale(1); } 58%, 92% { opacity: 0; transform: scale(.3); } 100% { opacity: 1; transform: scale(1); } }
.phago { animation: phago 6s ease-in-out infinite; }
.phago-o { fill: none; stroke: #7fb6ff; stroke-width: 2; stroke-dasharray: 5 3; }
.phago-i { fill: rgba(127,182,255,.12); stroke: #7fb6ff; stroke-width: 1.2; }
@keyframes phago { 0% { transform: translate(40px, 40px) scale(.5); opacity: 0; } 12% { opacity: 1; } 42% { transform: translate(110px, 88px) scale(1); } 58% { transform: translate(110px, 88px) scale(.8); opacity: 1; } 75%, 100% { transform: translate(110px, 88px) scale(.8); opacity: 0; } }
.lyso { fill: rgba(255,143,110,.75); animation: lyso 6s ease-in-out infinite; }

function floLines(view) {

      const nextBadge = rw.badges.find(b => !b.on); if (nextBadge) L.push(`Nächstes Abzeichen in Sicht: „${nextBadge.name}“ – ${nextBadge.desc}.`);
      L.push(`Du hast noch ${r.streak.left} ${r.streak.left === 1 ? 'Joker' : 'Joker'}. Ein verpatzter Tag reißt deine Serie also nicht gleich ab.`);
    }
  } else if (view === 'gewicht') {
    const pts = emaTrend(state.weights);

const sea = { tide: 0.64, targetTide: 0.64, moon: 1, targetMoon: 1, running: false };
function initSea() {
  const c = $('sea'), ctx = c.getContext('2d');

  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);

    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = Array.from({ length: Math.round(W * H / 4200) }, () => ({ x: Math.random() * W, y: Math.random() * H * 0.62, r: Math.random() * 1.3 + 0.3, p: Math.random() * 6.28, s: 0.6 + Math.random() * 1.6 }));
    plankton = Array.from({ length: 46 }, () => ({ x: Math.random() * W, y: H * (0.7 + Math.random() * 0.3), r: Math.random() * 1.8 + 0.6, v: 0.12 + Math.random() * 0.3, p: Math.random() * 6.28 }));
    if (REDUCE) draw(0);
  }
  function draw(t) {
    const time = t / 1000;
    sea.tide += (sea.targetTide - sea.tide) * (REDUCE ? 1 : 0.02);
    sea.moon += (sea.targetMoon - sea.moon) * (REDUCE ? 1 : 0.03);
    const horizon = H * sea.tide;
    let g = ctx.createLinearGradient(0, 0, 0, horizon);
    g.addColorStop(0, '#030812'); g.addColorStop(0.55, '#0a1d33'); g.addColorStop(1, '#14425a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, horizon + 2);
    ctx.fillStyle = '#ffffff';
    for (const s of stars) {
      if (s.y > horizon - 6) continue;
      ctx.globalAlpha = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(time * s.s + s.p));
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // Mond: Füllgrad = Fortschritt der Fastenphase (Vollmond = Ziel)
    const mr = Math.max(20, Math.min(W, H) * 0.05), mx = W * 0.8, my = Math.min(H * 0.13, 110) + 4 * Math.sin(time * 0.25);
    const rg = ctx.createRadialGradient(mx, my, mr * 0.6, mx, my, mr * 4.5);
    rg.addColorStop(0, `rgba(246,236,200,${0.12 + 0.18 * sea.moon})`); rg.addColorStop(1, 'rgba(246,236,200,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(mx, my, mr * 4.5, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#1a2a3b'; ctx.beginPath(); ctx.arc(mx, my, mr, 0, 6.283); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(mx, my, mr, 0, 6.283); ctx.clip();
    ctx.fillStyle = '#f6ecc8'; ctx.beginPath(); ctx.arc(mx - (1 - sea.moon) * mr * 2.05, my, mr, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(120,110,80,.18)';
    for (const [dx, dy, rr] of [[-0.3, -0.2, 0.22], [0.25, 0.3, 0.15], [0.1, -0.45, 0.1]]) { ctx.beginPath(); ctx.arc(mx + dx * mr, my + dy * mr, rr * mr, 0, 6.283); ctx.fill(); }
    ctx.restore();
    // Wasser
    g = ctx.createLinearGradient(0, horizon, 0, H);
    g.addColorStop(0, '#0f3d52'); g.addColorStop(1, '#030d17');
    ctx.fillStyle = g; ctx.fillRect(0, horizon, W, H - horizon);
    // Mondspiegelung
    for (let i = 0; i < 16; i++) {
      const y = horizon + 8 + i * 11, w = mr * (1.8 - i * 0.07) * (0.55 + 0.45 * Math.sin(time * 1.8 + i * 1.3));
      ctx.fillStyle = `rgba(246,236,200,${(0.32 * (1 - i / 16)) * sea.moon})`;
      ctx.fillRect(mx - w / 2 + Math.sin(time + i) * 5, y, w, 2);
    }
    // Wellen
    const layers = [
      { amp: 5, len: 170, spd: 0.7, off: 0, col: 'rgba(95,227,208,0.10)' },
      { amp: 8, len: 250, spd: -0.45, off: 16, col: 'rgba(79,180,232,0.13)' },
      { amp: 11, len: 330, spd: 0.32, off: 38, col: 'rgba(6,30,46,0.78)' },
      { amp: 14, len: 420, spd: -0.22, off: 80, col: 'rgba(3,16,28,0.85)' },
    ];
    for (const L of layers) {
      ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = 0; x <= W + 12; x += 12) {
        const y = horizon + L.off + Math.sin(x / L.len * 6.283 + time * L.spd) * L.amp + Math.sin(x / (L.len * 0.53) + time * L.spd * 1.7) * L.amp * 0.4;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H); ctx.closePath(); ctx.fillStyle = L.col; ctx.fill();
    }
    // Leuchtplankton
    ctx.fillStyle = '#5fe3d0';
    for (const p of plankton) {
      if (!REDUCE) { p.y -= p.v; p.x += Math.sin(time + p.p) * 0.25; }
      if (p.y < horizon + 30) { p.y = H + 5; p.x = Math.random() * W; }
      ctx.globalAlpha = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(time * 2.2 + p.p));
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function loop(t) { if (document.hidden) { sea.running = false; return; } draw(t); requestAnimationFrame(loop); }
  function start() { if (REDUCE || sea.running) return; sea.running = true; requestAnimationFrame(loop); }

  document.addEventListener('visibilitychange', () => { if (!document.hidden) start(); });
  resize(); start();
  sea.redraw = () => { if (REDUCE) draw(0); };
}
function updateSea() {
  const snap = resolve(now, state.plan);
  if (!snap || snap.mode === 'eating') { sea.targetTide = 0.56; sea.targetMoon = 1; }
  else { sea.targetTide = 0.68; sea.targetMoon = Math.max(0.08, Math.min(1, (now - snap.start) / (snap.end - snap.start))); }

}

function countUp(root) {

const PRESETS = {
  p16: { title: '16:8 · Klassiker', sub: 'Jeden Tag 12–20 Uhr essen', rules: () => DAYS.map(() => ({ enabled: true, start: 720, end: 1200 })) },
  p14: { title: '14:10 · Sanfter Einstieg', sub: 'Jeden Tag 9–19 Uhr essen', rules: () => DAYS.map(() => ({ enabled: true, start: 540, end: 1140 })) },
  p18: { title: '18:6 · Fortgeschritten', sub: 'Jeden Tag 10–16 Uhr essen', rules: () => DAYS.map(() => ({ enabled: true, start: 600, end: 960 })) },
  pweek: { title: 'Woche & Wochenende', sub: 'Mo–Fr 8–14 Uhr · Sa 17–2 Uhr nachts · So 16–22 Uhr', rules: () => DAYS.map((_, i) => i === 5 ? { enabled: true, start: 1020, end: 120 } : i === 6 ? { enabled: true, start: 960, end: 1320 } : { enabled: true, start: 480, end: 840 }) },

const store = {
  mode: 'local', col: null, unsub: null,
  async init() {
    let db = null, uid = null;

      if (window.claude?.use) {
        const [d, u] = await Promise.all([claude.use('db'), claude.use('user')]);

    } catch (e) { db = null; }

    let first = true;
    const timer = setTimeout(() => { if (first) this.fallback('Dein Konto antwortet gerade nicht. FastFlow speichert vorerst nur in diesem Browser.'); }, 10000);
    this.unsub = this.col.onSnapshot(snap => {
      clearTimeout(timer);
      const sessions = [], weights = []; let planDoc = null, profDoc = null;
      for (const d of snap.docs) {
        const v = d.data() || {};
        if (d.id === 'plan') planDoc = v; else if (d.id === 'profile') profDoc = v;
        else if (v.kind === 'session') sessions.push({ id: d.id, start: v.start, plannedEnd: v.plannedEnd, actualEnd: v.actualEnd ?? null });
        else if (v.kind === 'weight') weights.push({ id: d.id, date: v.date, kg: v.kg });
      }
      if (planDoc && Array.isArray(planDoc.rules) && planDoc.rules.length === 7) {
        if (!pendingPlanSave) state.plan = planDoc.rules;
        state.jokers = Number.isFinite(planDoc.jokers) ? planDoc.jokers : 2; state.planSaved = true;
      }
      state.profile = profDoc && profDoc.onboarded ? { name: String(profDoc.name || '').slice(0, 30), onboarded: true, since: Number(profDoc.since) || 0 } : null;
      state.sessions = sessions.sort((a, b) => a.plannedEnd - b.plannedEnd);
      state.weights = weights.sort((a, b) => a.date - b.date);
      if (first) { first = false; boot(); } else refresh();
    }, err => { clearTimeout(timer); this.fallback('Speichern im Konto klappt gerade nicht (' + (err?.code || 'Fehler') + '). FastFlow speichert vorerst nur in diesem Browser.'); });
  },
  fallback(msg) {
    if (this.unsub) { try { this.unsub(); } catch (e) {} this.unsub = null; }

    try {
      const s = JSON.parse(localStorage.getItem(LS_KEY));
      if (s && Array.isArray(s.plan) && s.plan.length === 7) Object.assign(state, { plan: s.plan, planSaved: !!s.planSaved, jokers: s.jokers ?? 2, sessions: s.sessions || [], weights: s.weights || [], profile: s.profile || null });

  async putSession(s) {

    const from = new Date(Math.max(last ?? lookback, lookback, since));
    // Nur Phasen, die nach der Einrichtung begonnen haben – keine erfundene Vergangenheit.
    const wins = fastingWindows(from, real, state.plan).filter(w => (last === null || w.start.getTime() >= last) && w.start.getTime() >= since);
    for (const w of wins) await store.putSession({ id: 's_' + w.start.getTime(), start: w.start.getTime(), plannedEnd: w.end.getTime(), actualEnd: null });
    if (wins.length) {
      const newest = wins[wins.length - 1];
      if (real - newest.end < 3 * 3600000 && !celebrated.has(newest.start.getTime())) {
        celebrated.add(newest.start.getTime());
        const done = { start: newest.start.getTime(), plannedEnd: newest.end.getTime(), actualEnd: null };
        setTimeout(() => { celebrate(); pearlBurst(pearlsFor(done)); floSay(`Geschafft, ${state.profile.name}! Deine Fastenphase ist vorbei. Dafür gibt's ${pearlsFor(done)} Perlen!`, { happy: true }); setTimeout(checkUnlocks, 2000); }, 900);
      }
      if (store.mode === 'local') refresh();
    }
  } catch (e) { toast('Verlauf konnte nicht aktualisiert werden'); }
  recording = false;
}

function bestRun(sessions) {
  const byDay = new Map();
  for (const s of sessions) { const k = startOfDay(new Date(s.plannedEnd)).getTime(); (byDay.get(k) || byDay.set(k, []).get(k)).push(s); }
  let run = 0, best = 0;
  for (const k of [...byDay.keys()].sort((a, b) => a - b)) { if (byDay.get(k).every(sGoal)) { run++; best = Math.max(best, run); } else run = 0; }
  return best;
}

function rewards() {
  const ss = state.sessions;
  let pearls = 0, prevMiss = false, comeback = false, night = false, longest = 0, hours = 0, goals = 0;
  for (const s of ss) {
    pearls += pearlsFor(s); hours += sFasted(s) / 60; longest = Math.max(longest, sFasted(s) / 60);
    if (sGoal(s)) { goals++; if (prevMiss) comeback = true; prevMiss = false; const h0 = new Date(s.start).getHours(); if (h0 >= 0 && h0 < 6) night = true; }
    else prevMiss = true;
  }
  const c = { goals, best: bestRun(ss), hours, night, longest, comeback, weights: state.weights.length };
  let r = 0; while (r + 1 < RANKS.length && pearls >= RANKS[r + 1].at) r++;
  const next = RANKS[r + 1];
  return {
    pearls, rank: r, rankName: RANKS[r].name, next,
    toNext: next ? next.at - pearls : 0,
    progress: next ? (pearls - RANKS[r].at) / (next.at - RANKS[r].at) : 1,
    badges: BADGES.map(b => ({ ...b, on: !!b.test(c) })),
  };
}

// Neu freigeschaltete Abzeichen und Rangaufstiege einmalig feiern
const SEEN_KEY = 'fastflow-seen-rewards';
let seenRewards = null;
function loadSeen() { if (seenRewards) return seenRewards; try { seenRewards = JSON.parse(localStorage.getItem(SEEN_KEY)) || null; } catch (e) { seenRewards = null; } return seenRewards; }
function saveSeen() { try { localStorage.setItem(SEEN_KEY, JSON.stringify(seenRewards)); } catch (e) {} }
function checkUnlocks() {
  if (!state.profile) return;
  const rw = rewards(), on = rw.badges.filter(b => b.on).map(b => b.id);
  const seen = loadSeen();
  if (!seen) { seenRewards = { badges: on, rank: rw.rank }; saveSeen(); return; }
  const fresh = rw.badges.filter(b => b.on && !seen.badges.includes(b.id));
  const rankUp = rw.rank > seen.rank;
  seenRewards = { badges: on, rank: rw.rank }; saveSeen();
  if (fresh.length) showUnlock(`Neues Abzeichen${fresh.length > 1 ? ` (+${fresh.length - 1} weitere)` : ''}`, fresh[0].name, fresh[0].desc, fresh[0].icon);
  else if (rankUp) showUnlock('Neuer Rang', rw.rankName, `Du hast ${rw.pearls} Perlen gesammelt.`, 'pearl');
}
function showUnlock(kicker, title, desc, icon) {
  const o = document.createElement('div'); o.className = 'unlock'; o.setAttribute('role', 'dialog'); o.setAttribute('aria-label', kicker);
  o.innerHTML = `<div class="unlockcard"><div class="rays"></div><span class="bicon big">${badgeSvg(icon)}</span><p class="eyebrow">${kicker}</p><h2>${esc(title)}</h2><p class="muted">${esc(desc)}</p><button type="button" class="primary">Weiter</button></div>`;
  document.body.appendChild(o); celebrate();
  floSay(`Wow, ${state.profile.name}! „${title}“ – das schreib ich mir mit Sternchen auf!`, { happy: true });
  const close = () => { o.classList.add('out'); setTimeout(() => o.remove(), 300); };
  o.querySelector('button').addEventListener('click', close); o.addEventListener('click', e => { if (e.target === o) close(); });
  o.querySelector('button').focus();
}
function pearlBurst(n) {
  if (!n) return;
  const p = document.createElement('div'); p.className = 'pearlburst'; p.textContent = `+${n} Perlen`;
  document.body.appendChild(p); setTimeout(() => p.remove(), 1900);
}

let lastStageKey = null;
function watchStage() {
  const snap = resolve(new Date(), state.plan);
  const key = snap && snap.mode === 'fasting' ? BODY[bodyStageIndex((Date.now() - snap.start) / 3600000)].key : 'eat';
  if (lastStageKey && key !== lastStageKey && key !== 'eat' && !simulated) {
    const st = BODY.find(s => s.key === key);
    toast(`Neue Phase: ${st.title}`); celebrate(); bodyPick = null;

}

function weekRows() {
  const rows = [];
  for (let i = 0; i < 7; i++) {
    const day = addDays(now, i - dayIdx(now)), next = addDays(day, 1), span = next - day;
    const segs = intervals(day, state.plan).map(iv => {
      const s = Math.max(iv.start, day), e = Math.min(iv.end, next);
      if (e <= s) return '';
      return `<div class="seg${iv.start < day ? ' cont' : ''}" style="left:${(s - day) / span * 100}%;width:${(e - s) / span * 100}%;animation-delay:${i * 60}ms"></div>`;
    }).join('');
    const today = day.toDateString() === now.toDateString();
    rows.push(`<div class="wrow${today ? ' today' : ''}"><span class="d">${DAYS[i]}</span><div class="track">${segs}${today ? `<div class="nowmark" style="left:${(now - day) / span * 100}%"></div>` : ''}</div></div>`);
  }
  return rows.join('');
}
function updateRing() {
  const snap = resolve(now, state.plan), prog = $('ringProg'); if (!snap || !prog) return;
  const p = Math.min(1, Math.max(0, (now - snap.start) / (snap.end - snap.start)));
  prog.style.strokeDashoffset = String(722.6 * (1 - p));
  const a = p * 6.283 - 1.5708; $('ringBead').setAttribute('cx', 150 + 115 * Math.cos(a)); $('ringBead').setAttribute('cy', 150 + 115 * Math.sin(a));
  $('ringTime').textContent = clock(snap.end - now);
}

function barChart(bs, byMonth) {
  const W = 400, H = 230, Lp = 34, Rp = 8, T = 12, B = 28;
  const max = Math.max(6, ...bs.map(b => Math.max(b.f, b.t)));
  const top = Math.ceil(max / 6) * 6, y = v => T + (H - T - B) * (1 - v / top), bw = (W - Lp - Rp) / bs.length;
  let g = '', bars = '', path = '';
  for (const v of [0, top / 2, top]) g += `<line class="grid" x1="${Lp}" x2="${W - Rp}" y1="${y(v)}" y2="${y(v)}"/><text x="${Lp - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const every = Math.ceil(bs.length / 7);
  bs.forEach((b, i) => {
    const x = Lp + i * bw;
    if (b.f > 0) bars += `<rect class="barr" style="animation-delay:${i * 25}ms" x="${x + bw * 0.16}" y="${y(b.f)}" width="${bw * 0.68}" height="${y(0) - y(b.f)}" rx="${Math.min(6, bw * 0.2)}"><title>${b.f.toFixed(1)} h von ${b.t.toFixed(1)} h</title></rect>`;
    path += `${i ? 'L' : 'M'}${x} ${y(b.t)} L${x + bw} ${y(b.t)} `;
    if (i % every === 0) g += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${byMonth ? ['J','F','M','A','M','J','J','A','S','O','N','D'][b.start.getMonth()] : bs.length <= 7 ? DAYS[dayIdx(b.start)] : b.start.getDate()}</text>`;
  });
  return `<div class="chartbox"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gefastete Stunden mit Soll-Linie"><defs><linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fe3d0"/><stop offset="1" stop-color="#2a7f9e"/></linearGradient></defs>${g}${bars}<path class="target" d="${path}"/></svg></div>
  <div class="legend"><span><i style="background:linear-gradient(#5fe3d0,#2a7f9e)"></i>Gefastet (Stunden)</span><span><i style="background:#f6ecc8"></i>Soll laut Plan</span></div>`;
}

function lineChart(pts) {
  const W = 400, H = 220, Lp = 44, Rp = 10, T = 12, B = 28;
  const vals = pts.flatMap(p => [p.kg, p.trend]);
  const lo = Math.floor(Math.min(...vals) - 0.5), hi = Math.ceil(Math.max(...vals) + 0.5);
  const t0 = pts[0].date.getTime(), t1 = Math.max(pts[pts.length - 1].date.getTime(), t0 + 86400000);
  const x = t => Lp + (W - Lp - Rp) * (t - t0) / (t1 - t0), y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let g = '';
  for (const v of [lo, (lo + hi) / 2, hi]) g += `<line class="grid" x1="${Lp}" x2="${W - Rp}" y1="${y(v)}" y2="${y(v)}"/><text x="${Lp - 8}" y="${y(v) + 4}" text-anchor="end">${v.toFixed(1)}</text>`;
  g += `<text x="${Lp}" y="${H - 6}">${ddmm(pts[0].date)}</text><text x="${W - Rp}" y="${H - 6}" text-anchor="end">${ddmm(pts[pts.length - 1].date)}</text>`;
  const dots = pts.map(p => `<circle class="pt" cx="${x(p.date.getTime())}" cy="${y(p.kg)}" r="4"><title>${ddmm(p.date)}: ${p.kg.toFixed(1)} kg</title></circle>`).join('');
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.date.getTime())} ${y(p.trend)}`).join(' ');
  return `<div class="chartbox"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gewicht mit Trendlinie">${g}${dots}<path class="trend" pathLength="1" d="${line}"/></svg></div>
  <div class="legend"><span><i style="background:#7fb6ff"></i>Messung</span><span><i style="background:#5fe3d0"></i>Trend</span></div>`;
}

function renderView(animate = true) {

  const host = document.querySelector(`.view-host[data-view="${v}"]`);

  host.innerHTML = { heute: viewHeute, plan: viewPlan, analyse: viewAnalyse, gewicht: viewGewicht, profil: viewProfil }[v]();
  if (animate) { host.classList.remove('view'); void host.offsetWidth; host.classList.add('view'); }
  document.querySelectorAll('.tabbar a').forEach(a => { if (a.dataset.tab === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  countUp(host);
  if (v === 'heute') requestAnimationFrame(() => requestAnimationFrame(updateRing));
  checkUnlocks();
  updateSea();
}

}
function showOnboarding() {
  $('app').hidden = true; $('tabbar').hidden = true; $('buddy').hidden = true;
  Object.assign(ob, { step: 0, name: '', adult: false, health: false, preset: 'p16', blocked: false });
  $('onboard').hidden = false; renderOnboarding();
}
function showApp() {
  $('onboard').hidden = true; $('app').hidden = false; $('tabbar').hidden = false; $('buddy').hidden = false;
  mountOtters(); renderView(); recordCompleted(); watchStage();
  setTimeout(() => floNext(currentView(), true), 700);
}
function boot() {
  state.ready = true;
  const sp = $('splash'); sp.style.opacity = '0'; setTimeout(() => sp.remove(), 500);
  if (state.profile) showApp(); else showOnboarding();
}

window.addEventListener('hashchange', () => { if (!state.profile) return; renderView(); floNext(currentView(), true); window.scrollTo({ top: 0, behavior: REDUCE ? 'auto' : 'smooth' }); });
$('otterBtn').addEventListener('click', () => {
  const o = $('otterBtn').querySelector('.otter');
  if (o && !REDUCE) { o.classList.remove('happy'); void o.getBoundingClientRect(); o.classList.add('happy'); setTimeout(() => o.classList.remove('happy'), 2200); }
  floNext(currentView());
});
$('bubble').addEventListener('click', () => floNext(currentView()));

$('app').addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.k !== undefined) {
    const i = +t.dataset.i, k = t.dataset.k;
    if (k === 'enabled') state.plan[i].enabled = t.checked; else if (t.value) state.plan[i][k] = toM(t.value);
    t.blur(); savePlanSoon(); renderView(false);
    const hints = validate(state.plan); if (hints.length) floSay(`Mir ist was aufgefallen: ${hints[0].msg}`);
  } else if (t.id === 'simInput' && t.value) { now = new Date(t.value); simulated = true; renderView(false); toast('Testzeit gesetzt'); }
  else if (t.id === 'leadInput') { profilLead = Math.min(120, Math.max(5, Math.round(+t.value || 30))); t.blur(); renderView(false); }
  else if (t.id === 'jokerInput') { state.jokers = Math.min(10, Math.max(0, Math.round(+t.value || 0))); t.blur(); savePlanSoon(); }
});
$('app').addEventListener('submit', async e => {
  if (e.target.id !== 'weightForm') return;
  e.preventDefault();
  const d = $('wDate').value, kg = Math.round(parseFloat(String($('wKg').value).replace(',', '.')) * 10) / 10;
  if (!d || !(kg >= 30 && kg <= 350)) { toast('Bitte ein Gewicht zwischen 30 und 350 kg eintragen'); return; }
  const [y, m, dd] = d.split('-').map(Number);
  try { await store.putWeight({ id: 'w_' + d, date: new Date(y, m - 1, dd, 8).getTime(), kg }); document.activeElement?.blur(); toast('Gewicht eingetragen'); renderView(false); floNext('gewicht', true); }
  catch (err) { toast('Gewicht nicht gespeichert'); }
});
$('app').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.preset) { state.plan = PRESETS[b.dataset.preset].rules(); savePlanSoon(); renderView(false); floSay(`Neuer Rhythmus: ${PRESETS[b.dataset.preset].title}. Ich hab mitgeschrieben!`); }
  else if (b.dataset.stage) { bodyPick = +b.dataset.stage; renderView(false); const st = BODY[bodyPick]; floSay(`${st.title}: ${st.what.split('. ')[0]}.`); }
  else if (b.dataset.period) { analysePeriod = b.dataset.period; renderView(false); floNext('analyse', true); }
  else if (b.dataset.step) { now = new Date(now.getTime() + (+b.dataset.step) * 60000); simulated = true; renderView(false); toast('Testzeit: ' + DAYS[dayIdx(now)] + ' ' + hhmm(now)); }
  else if (b.id === 'simNow') { simulated = false; renderView(false); toast('Echte Zeit'); }
  else if (b.id === 'endEarly') { b.hidden = true; $('endConfirm').hidden = false; }
  else if (b.id === 'endNo') { $('endConfirm').hidden = true; $('endEarly').hidden = false; }
  else if (b.id === 'endYes') {
    const snap = resolve(new Date(), state.plan);
    if (snap && snap.mode === 'fasting') {
      const real = Date.now();
      await store.putSession({ id: 's_' + snap.start.getTime(), start: snap.start.getTime(), plannedEnd: snap.end.getTime(), actualEnd: real });
      renderView(false);
      floSay(`Notiert: nach ${hoursText(Math.floor((real - snap.start) / 60000))} beendet. Jede Ebbe zählt – die nächste kommt bestimmt.`);
    }
  }
  else if (b.dataset.act === 'early' || b.dataset.act === 'reset') {
    const s = state.sessions.find(x => x.id === b.dataset.id); if (!s) return;
    let actualEnd = null;
    if (b.dataset.act === 'early') { const v = $('ae_' + s.id).value; if (!v) return; actualEnd = Math.min(Math.max(new Date(v).getTime(), s.start), s.plannedEnd); if (actualEnd >= s.plannedEnd) actualEnd = null; }
    await store.putSession({ ...s, actualEnd }); toast('Gespeichert'); renderView(false);
  }
  else if (b.dataset.act === 'delw') { await store.remove(b.dataset.id); toast('Eintrag gelöscht'); renderView(false); }
  else if (b.id === 'demoBtn') {
    const real = new Date(); let n = 0;
    for (const w of fastingWindows(addDays(real, -14), real, state.plan)) {
      n++; await store.putSession({ id: 's_' + w.start.getTime(), start: w.start.getTime(), plannedEnd: w.end.getTime(), actualEnd: n % 5 === 0 ? w.end.getTime() - 3 * 3600000 : null });
    }
    for (let k = 14; k >= 0; k--) { const d = addDays(real, -k); await store.putWeight({ id: 'w_' + toDateInput(d), date: new Date(d.getFullYear(), d.getMonth(), d.getDate(), 8).getTime(), kg: Math.round((84 - (14 - k) * 0.15 + Math.sin(k * 1.7) * 0.6) * 10) / 10 }); }
    toast('Beispieldaten geladen'); renderView(false); celebrate(); floNext('analyse', true);
  }
  else if (b.id === 'clearBtn') { $('clearConfirm').hidden = false; }
  else if (b.id === 'clearNo') { $('clearConfirm').hidden = true; }
  else if (b.id === 'clearYes') {
    for (const id of [...state.sessions.map(s => s.id), ...state.weights.map(w => w.id)]) { try { await store.remove(id); } catch (err) {} }
    toast('Verlauf gelöscht'); renderView(false);
  }
  else if (b.id === 'saveName') {
    const v = $('nameInput').value.trim().slice(0, 30); if (!v) { toast('Bitte einen Namen eingeben'); return; }
    state.profile.name = v; await store.saveProfile(); toast('Name gespeichert'); floSay(`Freut mich, ${v}! Hab's sofort in mein Notizbuch geschrieben.`, { happy: true });
  }
  else if (b.id === 'resetAll') { $('resetConfirm').hidden = false; }
  else if (b.id === 'resetNo') { $('resetConfirm').hidden = true; }
  else if (b.id === 'resetYes') {
    for (const id of [...state.sessions.map(s => s.id), ...state.weights.map(w => w.id), 'plan', 'profile']) { try { await store.remove(id); } catch (err) {} }
    Object.assign(state, { profile: null, planSaved: false, sessions: [], weights: [], plan: PRESETS.p16.rules() });
    location.hash = '#heute'; showOnboarding();
  }
});

setInterval(() => { if (!state.profile || $('app').hidden) return; if (!simulated) now = new Date(); if (currentView() === 'heute') updateRing(); }, 1000);
setInterval(() => { if (state.profile && !simulated) { now = new Date(); now.setSeconds(0, 0); updateSea(); recordCompleted(); watchStage(); if (currentView() === 'heute') renderView(false); } }, 60000);

mountOtters();
initSea();
store.init();
</script>
